name: Deploy Producao OCI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Automatizado via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v5

      - name: Sincronizar Arquivos com a VM via Rsync/SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "."
          target: "/var/www/app"
          strip_components: 0

      - name: Ajustar Permissões e Validar Nginx
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            sudo chown -R ariston:www-data /var/www/app
            sudo chmod -R 775 /var/www/app
            sudo nginx -t
            sudo systemctl reload nginx